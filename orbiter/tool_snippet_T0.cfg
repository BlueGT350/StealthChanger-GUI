#####################################################################
#  ktc-filament : OPTIONAL per-tool Orbiter button snippet
#
#  COMMUNITY OPTION, not used by default. orbiter_addon.cfg already
#  defines all six buttons. If you'd rather keep each button with its
#  tool, delete that tool's block from orbiter_addon.cfg, copy the
#  block below into toolchanger/tools/T0.cfg (KTC-Easy includes it),
#  uncomment it and change every 0 / nhkT0 to your tool number and
#  board name. The pin below is an example for a Nitehawk-36 X-STOP
#  port. Never define the same pin in both places.
#
#  Also update button_tools in _ORBITER_SETTINGS.
#####################################################################

#[gcode_button T0_orbiter_button]
#pin: ^nhkT0:gpio13
#press_gcode:

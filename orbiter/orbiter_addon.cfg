#####################################################################
#  ktc-filament : ORBITER ADD-ON                    orbiter_addon.cfg
#
#  Thin layer for the Orbiter 2.5 smart sensor button. It has NO
#  load/unload logic of its own: a press is turned into
#  FILAMENT_LOAD / FILAMENT_UNLOAD from the core module, or into a
#  tangle PAUSE while printing.
#
#  Needs: filament/filament_macros.cfg (the core module) included too.
#  The Orbiter filament sensor stays a normal
#    [filament_switch_sensor filament_sensor_T#]
#  in each tools/T#.cfg; the core module finds it through
#  sensor_pattern in _FILAMENT_SETTINGS.
#
#  Install: in printer.cfg, after the core module include, add
#    [include ktc-filament/orbiter/orbiter_addon.cfg]
#
#  What a press does:
#    printing, button on the ACTIVE tool  -> tangle: PAUSE, warn or
#                                            ignore (tangle_mode)
#    printing, button on a DOCKED tool    -> ignored (message only)
#    paused                               -> ignored (message only)
#    tool marked loaded                   -> FILAMENT_UNLOAD
#    tool partly unloaded (nozzle change) -> FILAMENT_LOAD feeds it back
#                                            (sensor empty: message only)
#    tool empty, filament at the sensor   -> FILAMENT_LOAD
#    tool empty, sensor empty             -> nothing, message only
#    tool empty, tool has no sensor       -> FILAMENT_LOAD
#  A second press that arrives while a load/unload is still running
#  (or within press_lockout seconds after it) is ignored, so a double
#  press can't load and then immediately unload.
#
#  KTC-Easy overrides: NONE. Only plain PAUSE and the core macros.
#####################################################################


#####################################################################
#  SETTINGS
#####################################################################
[gcode_macro _ORBITER_SETTINGS]
description: ktc-filament Orbiter add-on settings (read by the GUI)
# --- do not edit: lets the GUI detect this add-on ---
variable_module_version: '0.2.0'
variable_requires_filament_version: '0.2.0'
# Tool numbers that have an Orbiter button wired (for the GUI badges).
# The pin blocks themselves are NOT in this file. They live in
# ~/printer_data/config/ktc-filament-orbiter.cfg so an update cannot
# reset them. To change this list without editing the clone, repeat
# variable_button_tools under [gcode_macro _ORBITER_SETTINGS] in that file.
variable_button_tools: [0, 1, 2, 3, 4, 5]
# What a press on the ACTIVE tool does while printing (tangle / tug
# signal):
#   'pause' : pause the print
#   'warn'  : print a warning in the console, keep printing
#   'off'   : ignore it completely (button does nothing while printing)
# Change it until the next restart with ORBITER_TANGLE MODE=PAUSE|WARN|OFF
variable_tangle_mode: 'off'
# Seconds after a button load/unload finishes during which further
# presses are ignored (stops queued double presses).
variable_press_lockout: 3.0
# --- internal, do not edit ---
variable_last_done: -1000.0
gcode:
  RESPOND MSG="ktc-filament Orbiter add-on v{module_version}, buttons on T{button_tools|join(', T')}, tangle_mode {tangle_mode}"


#####################################################################
#  BUTTON PINS are not in this file.
#
#  Your pins live in ~/printer_data/config/ktc-filament-orbiter.cfg,
#  which printer.cfg includes after this file. setup.sh creates that
#  file once from orbiter/orbiter_pins.cfg and never overwrites it.
#  Do not put [gcode_button] blocks back here: Klipper would see the
#  same pin twice (once from the clone, once from your file).
#
#  Community option: one block per tools/T#.cfg instead of the user
#  file (see orbiter/tool_snippet_T0.cfg). Do not do both.
#####################################################################
#  _ORBITER_BUTTON TOOL=n   (called by the buttons in ktc-filament-orbiter.cfg)
#  You can also run it from the console to test a tool's logic
#  without touching the button.
#####################################################################
[gcode_macro _ORBITER_BUTTON]
gcode:
  {% set o = printer["gcode_macro _ORBITER_SETTINGS"] %}
  {% if "gcode_macro _FILAMENT_SETTINGS" not in printer %}
    { action_raise_error("Orbiter add-on: the core module filament_macros.cfg is not included") }
  {% endif %}
  {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
  {% set t = params.TOOL|int %}
  # --- find the tool by its tool_number ---
  {% set tl = namespace(name='') %}
  {% for n in printer.toolchanger.tool_names %}
    {% if printer[n].tool_number == t %}{% set tl.name = n %}{% endif %}
  {% endfor %}
  {% if tl.name == '' %}
    { action_raise_error("Orbiter button: there is no tool T%d" % t) }
  {% endif %}
  {% set active = printer[tl.name].active %}
  {% set v = printer.save_variables.variables %}
  {% set loaded = v.get("t" ~ t ~ "_loaded")|default(False, true) %}
  {% set partial = v.get("t" ~ t ~ "_partial")|default(False, true) %}
  # --- sensor, same lookup as the core module ---
  {% set sname = s.sensor_map[t] if t in s.sensor_map else s.sensor_pattern|replace('{n}', t|string) %}
  {% set sn = namespace(obj=none, txt='no sensor') %}
  {% if sname %}
    {% if ("filament_switch_sensor " ~ sname) in printer %}
      {% set sn.obj = printer["filament_switch_sensor " ~ sname] %}
    {% elif ("filament_motion_sensor " ~ sname) in printer %}
      {% set sn.obj = printer["filament_motion_sensor " ~ sname] %}
    {% endif %}
  {% endif %}
  {% if sn.obj is not none %}
    {% set sn.txt = 'filament' if sn.obj.filament_detected else 'empty' %}
  {% endif %}
  {% set state = printer.print_stats.state %}
  {% set now = printer.toolhead.estimated_print_time %}
  {% set since = now - o.last_done|float %}
  RESPOND MSG="T{t} button | sensor {sn.txt} | marked {'partial (nozzle change)' if partial else ('loaded' if loaded else 'empty')} | printer {state} | {'active tool' if active else 'docked'}"
  {% set tmode = o.tangle_mode|string|lower %}
  {% if state == "printing" %}
    {% if active and tmode == 'pause' %}
      RESPOND TYPE=error MSG="Tool T{t}: tangle signal on the active tool while printing, PAUSING"
      M117 T{t} tangle, paused
      PAUSE
    {% elif active and tmode == 'warn' %}
      RESPOND TYPE=error MSG="Tool T{t}: tangle signal on the active tool (tangle_mode is warn, not pausing)"
    {% elif active %}
      RESPOND MSG="Tool T{t}: button on the active tool while printing, ignored (tangle_mode is off)"
    {% else %}
      RESPOND MSG="Tool T{t}: button on a docked tool while printing, ignored"
    {% endif %}
  {% elif state == "paused" %}
    RESPOND TYPE=error MSG="Tool T{t}: printer is paused, button ignored. Use FILAMENT_LOAD / FILAMENT_UNLOAD TOOL={t} from the console, or resume / cancel first."
  {% elif since >= 0 and since < o.press_lockout|float %}
    RESPOND MSG="Tool T{t}: press ignored, a button load/unload just finished ({since|round(1)}s ago)"
  {% elif loaded %}
    RESPOND MSG="Tool T{t}: marked loaded, starting UNLOAD"
    FILAMENT_UNLOAD TOOL={t}
    _ORBITER_PRESS_DONE
  {% elif partial and sn.obj is not none and not sn.obj.filament_detected %}
    RESPOND TYPE=error MSG="Tool T{t}: marked partly unloaded for a nozzle change but the sensor reads empty, nothing done. Check the filament, then FILAMENT_LOAD TOOL={t} FORCE=1 or SET_FILAMENT_LOADED TOOL={t} LOADED=0"
  {% elif partial %}
    RESPOND MSG="Tool T{t}: partly unloaded for a nozzle change, starting LOAD to feed it back"
    FILAMENT_LOAD TOOL={t}
    _ORBITER_PRESS_DONE
  {% elif sn.obj is not none and not sn.obj.filament_detected %}
    RESPOND MSG="Tool T{t}: no filament at the sensor and tool is empty, nothing to do. Insert filament and press again."
  {% else %}
    RESPOND MSG="Tool T{t}: tool is empty{', filament at the sensor' if sn.obj is not none else ' (no sensor)'}, starting LOAD"
    FILAMENT_LOAD TOOL={t}
    _ORBITER_PRESS_DONE
  {% endif %}

#####################################################################
#  ORBITER_TANGLE MODE=PAUSE|WARN|OFF
#  Changes the tangle behaviour until the next restart. To make it
#  permanent, edit variable_tangle_mode in _ORBITER_SETTINGS.
#####################################################################
[gcode_macro ORBITER_TANGLE]
description: Orbiter tangle check until restart. Options: MODE=PAUSE, WARN or OFF, no MODE shows the current mode. Example: ORBITER_TANGLE MODE=WARN
gcode:
  {% set _hint = params.MODE|default('PAUSE, WARN or OFF') %}
  {% set args = params %}
  {% set o = printer["gcode_macro _ORBITER_SETTINGS"] %}
  {% if 'MODE' not in args %}
    RESPOND MSG="Orbiter tangle_mode is {o.tangle_mode}. Use ORBITER_TANGLE MODE=PAUSE, WARN or OFF"
  {% else %}
    {% set m = args.MODE|lower %}
    {% if m not in ['pause', 'warn', 'off'] %}
      { action_raise_error("ORBITER_TANGLE: MODE must be PAUSE, WARN or OFF") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ORBITER_SETTINGS VARIABLE=tangle_mode VALUE="'{m}'"
    RESPOND MSG="Orbiter tangle_mode set to {m} (until restart)"
  {% endif %}

# Stamps the time a button load/unload finished. This is rendered
# only when it runs, i.e. after the load/unload completed, so presses
# queued during a load see a fresh stamp and are dropped.
[gcode_macro _ORBITER_PRESS_DONE]
gcode:
  SET_GCODE_VARIABLE MACRO=_ORBITER_SETTINGS VARIABLE=last_done VALUE={printer.toolhead.estimated_print_time}

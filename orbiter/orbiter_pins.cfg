# ktc-filament-orbiter.cfg: YOUR Orbiter button pins.
#
# This is the template. setup.sh copies it once to
# ~/printer_data/config/ktc-filament-orbiter.cfg and never overwrites
# that copy. The copy is outside the git clone, so Moonraker updates
# do not reset it. printer.cfg includes it after orbiter_addon.cfg.
#
# Example pins: Orbiter button (yellow FTU wire) on a Nitehawk-36
# X-STOP port = gpio13. Change the board name and pin to match your
# printer. ^ turns on the pull-up. If a press does nothing, or only
# fires on release, change ^ to ^! for that tool.
#
# Do not also define these pins in the clone or in tools/T#.cfg.

[gcode_button T0_orbiter_button]
pin: ^nhkT0:gpio13
press_gcode:
  _ORBITER_BUTTON TOOL=0

[gcode_button T1_orbiter_button]
pin: ^nhkT1:gpio13
press_gcode:
  _ORBITER_BUTTON TOOL=1

[gcode_button T2_orbiter_button]
pin: ^nhkT2:gpio13
press_gcode:
  _ORBITER_BUTTON TOOL=2

[gcode_button T3_orbiter_button]
pin: ^nhkT3:gpio13
press_gcode:
  _ORBITER_BUTTON TOOL=3

[gcode_button T4_orbiter_button]
pin: ^nhkT4:gpio13
press_gcode:
  _ORBITER_BUTTON TOOL=4

[gcode_button T5_orbiter_button]
pin: ^nhkT5:gpio13
press_gcode:
  _ORBITER_BUTTON TOOL=5

#####################################################################
#  ktc-filament : CORE FILAMENT MODULE            filament_macros.cfg
#
#  Manual load / unload for klipper-toolchanger-easy (KTC-Easy).
#  Works with or without a filament sensor, with any number of tools,
#  and does NOT need an Orbiter. The Orbiter add-on (and later the
#  endless spool module and the web GUI) are built on top of this file.
#
#  Needs: KTC-Easy (the [toolchanger] / [tool T#] objects), a Klipper
#         recent enough for KTC-Easy, [save_variables] and [respond].
#
#  Install (setup.sh in the repo root does all of this; see README.md):
#    1. Copy the ktc-filament folder next to printer.cfg, e.g.
#         ~/printer_data/config/ktc-filament/
#    2. In printer.cfg, AFTER the KTC-Easy include, add:
#         [include ktc-filament/filament/filament_macros.cfg]
#    3. FIRMWARE_RESTART, then run SHOW_TOOLS.
#
#  Commands (all take the tool NUMBER, e.g. TOOL=3 for T3):
#    FILAMENT_LOAD     TOOL=n [FORCE=1]
#    FILAMENT_UNLOAD   TOOL=n
#    FILAMENT_UNLOAD_PARTIAL TOOL=n [LENGTH=mm] [FORCE=1]   nozzle change
#    SET_FILAMENT_LOADED TOOL=n LOADED=0|1
#    SET_FILAMENT_TEMP TOOL=n TYPE=HIGH|LOW|CUSTOM
#                      [TEMP=t] [LOAD_TEMP=t] [UNLOAD_TEMP=t]
#    SET_FILAMENT_MOTION TOOL=n [LOAD_LENGTH=mm] [LOAD_SPEED=mm/min]
#                      [UNLOAD_LENGTH=mm] [UNLOAD_SPEED=mm/min]
#                      [PARTIAL_LENGTH=mm] [RESET=1]
#    SET_TOOL_FILAMENT TOOL=n [MATERIAL=PLA] [COLOR=FF0000]
#                      [SPOOL="name"] [PROFILE=HIGH|LOW|CUSTOM|240] [CLEAR=1]
#    SHOW_TOOLS
#    SPOOL_SETUP [TOOL=n]   click-through pop-up for material, colour, profile
#  HELP in the console lists each command with its options and an example.
#
#  Saved per tool in variables.cfg (save_variables), n = tool number.
#  (Klipper cannot delete a saved key, so "reset" stores None, which
#  these macros treat the same as "not set".)
#    tn_loaded            True / False
#    tn_partial           True while the tool is partly unloaded for a
#                         nozzle change (tn_loaded is then False)
#    tn_partial_mm        how far that partial unload pulled back, in mm
#    tn_temp_profile      "HIGH" / "LOW" / "CUSTOM"
#    tn_custom_load_temp, tn_custom_unload_temp
#    tn_load_length, tn_load_speed, tn_unload_length, tn_unload_speed,
#    tn_partial_length    (per-tool nozzle-change pull-back)
#    tn_material, tn_color, tn_spool
#  Anything not saved falls back to the defaults in _FILAMENT_SETTINGS.
#
#  KTC-Easy overrides: NONE. This file does not redefine any KTC-Easy
#  macro (no T#, M104, M109, RESUME, INITIALIZE_TOOLCHANGER, hooks).
#  It only reads printer.toolchanger / printer['tool Tn'] and uses
#  Klipper core commands (ACTIVATE_EXTRUDER, SET_HEATER_TEMPERATURE,
#  TEMPERATURE_WAIT, SAVE_VARIABLE, RESPOND).
#
#  Notes for macro writers (checked by tests/klipper_harness.py):
#  - Klipper's config reader cuts every line at the first #, even
#    inside quotes or a Jinja expression, and at a ; that follows a
#    space. So no line in this file may contain # or ;.
#  - Never start a console message with "T<number>:", "B:" or "C:".
#    Mainsail strips the "echo:" / "//" / "!!" prefix and then hides
#    those lines as temperature reports (Console > "Hide temperatures",
#    on by default), with no error. That is why per-tool lines read
#    "T0 | ..." or "Tool T0: ..." and never "T0: ...".
#  - Mainsail form hints: Mainsail fills each field of a macro's form
#    with the default it finds in params.NAME|default(...). The lines
#      {% set _hint = params.TOOL|default('tool number, e.g. 0') %}
#    at the top of a macro exist ONLY for that placeholder text. The
#    macro then reads its real values through args (args = params), which
#    Mainsail does not scan, so a hint is never used as a value. A field
#    left blank is not sent by Mainsail at all, same as leaving the
#    option off in the console. Hint text: no # ; ' " ( ) or braces.
#####################################################################


#####################################################################
#  Shared Klipper sections
#  Klipper merges duplicate sections, so these are safe even if
#  printer.cfg already has them, AS LONG AS the filename matches.
#  If your variables file lives somewhere else, change the path here
#  (or delete this [save_variables] block and keep your own).
#####################################################################
[save_variables]
filename: ~/printer_data/config/variables.cfg

[respond]


#####################################################################
#  SETTINGS: the only block most people need to edit
#  Speeds are in mm/min (the F value of a G1 move), lengths in mm.
#####################################################################
[gcode_macro _FILAMENT_SETTINGS]
description: ktc-filament core settings (read by the other modules and the GUI)
# --- do not edit: lets the GUI / other modules detect this module ---
variable_module_version: '0.2.0'

# --- temperature profiles (degrees C) ---
# HIGH and LOW cover nearly every filament. CUSTOM is per tool,
# set with SET_FILAMENT_TEMP TOOL=n TYPE=CUSTOM TEMP=225
variable_high_load_temp: 260      # ABS / ASA / PC ...
variable_high_unload_temp: 260
variable_low_load_temp: 240       # PLA / PETG ...
variable_low_unload_temp: 240
variable_default_profile: 'LOW'   # used for tools with no saved profile
variable_temp_tolerance: 2        # start moving at target minus this

# --- load (defaults; per-tool overrides via SET_FILAMENT_MOTION) ---
variable_load_length: 60          # sensor/gears to nozzle, measure yours
variable_load_speed: 300          # mm/min
variable_purge_length: 25         # slow purge after loading, 0 = none
variable_purge_speed: 150         # mm/min
variable_load_retract: 0          # small retract after purge, 0 = none
variable_load_retract_speed: 1800

# --- unload (defaults; per-tool overrides via SET_FILAMENT_MOTION) ---
variable_unload_tip_push: 5       # push first to soften the tip
variable_unload_tip_speed: 500    # mm/min
variable_unload_length: 150       # total retract length
variable_unload_speed: 7200       # mm/min
# Long moves are split into pieces no longer than this (and never
# longer than the extruder's max_extrude_only_distance). 75 gives the
# classic 2 x 75 mm unload.
variable_max_move_length: 75

# --- nozzle change (FILAMENT_UNLOAD_PARTIAL) ---
# Pulls the filament tip out of the nozzle and heat break but keeps
# it in the extruder gears, so a Revo nozzle can be swapped and the
# same filament fed straight back with FILAMENT_LOAD. It must clear
# the nozzle and heat break and stay well short of load_length (the
# gears to nozzle path). The macro refuses anything closer than
# partial_margin mm to the tool's load length.
variable_partial_unload_length: 35  # mm, per tool: SET_FILAMENT_MOTION PARTIAL_LENGTH=
variable_partial_margin: 10         # mm kept between the pull-back and load_length

# --- filament sensors (optional) ---
# Name of each tool's filament sensor section. {n} is replaced by the
# tool number, so 'filament_sensor_T{n}' means
#   [filament_switch_sensor filament_sensor_T0] for T0 and so on.
# filament_switch_sensor and filament_motion_sensor both work.
# Set to '' if your tools have no sensors (flag-only tracking).
variable_sensor_pattern: 'filament_sensor_T{n}'
# Per-tool exceptions, e.g. {2: 'my_odd_sensor', 4: ''}
# ('' = that tool has no sensor). Leave {} if the pattern fits all.
variable_sensor_map: {}
gcode:
  RESPOND MSG="ktc-filament core v{module_version}. Run SHOW_TOOLS for the per-tool state."


#####################################################################
#  FILAMENT_LOAD TOOL=n [FORCE=1]
#  Heat the tool to its profile load temp, feed load_length, purge,
#  mark it loaded, then put the heater target and active extruder
#  back exactly as they were. A docked tool is loaded in its dock
#  (ACTIVATE_EXTRUDER only, no tool pickup).
#  Refuses if: printing, tool already marked loaded, or the tool has
#  a sensor that reads empty. FORCE=1 skips the last two checks.
#####################################################################
[gcode_macro FILAMENT_LOAD]
description: Load filament into one tool. Options: TOOL=n (required), FORCE=1 skips the already-loaded and sensor checks. Example: FILAMENT_LOAD TOOL=0
gcode:
  {% set _hint = params.TOOL|default('tool number, e.g. 0') %}
  {% set _hint = params.FORCE|default('1 = skip loaded and sensor checks') %}
  {% set args = params %}
  {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
  {% if args.TOOL is not defined %}
    { action_raise_error("FILAMENT_LOAD: TOOL= is required, e.g. FILAMENT_LOAD TOOL=0") }
  {% endif %}
  {% set t = args.TOOL|int %}
  {% set force = args.FORCE|default(0)|int == 1 %}
  # --- find the tool by its tool_number (not its list position) ---
  {% set tl = namespace(name='') %}
  {% for n in printer.toolchanger.tool_names %}
    {% if printer[n].tool_number == t %}{% set tl.name = n %}{% endif %}
  {% endfor %}
  {% if tl.name == '' %}
    { action_raise_error("FILAMENT_LOAD: there is no tool T%d. Known tools: %s" % (t, printer.toolchanger.tool_numbers|join(', '))) }
  {% endif %}
  {% set ext = printer[tl.name].extruder %}
  {% if not ext %}
    { action_raise_error("FILAMENT_LOAD: T%d has no extruder set in its [tool] section" % t) }
  {% endif %}
  {% set cfg = printer.configfile.settings[ext] %}
  {% set max_t = cfg.max_temp|float %}
  {% set min_t = cfg.min_extrude_temp|default(170)|float %}
  {% set max_move = [s.max_move_length|float, cfg.max_extrude_only_distance|default(50)|float]|min %}
  # --- saved state for this tool ---
  {% set v = printer.save_variables.variables %}
  {% set k = "t" ~ t ~ "_" %}
  {% set loaded = v.get(k ~ "loaded")|default(False, true) %}
  {% set partial = v.get(k ~ "partial")|default(False, true) %}
  {% set partial_mm = v.get(k ~ "partial_mm")|default(0, true)|float %}
  # --- sensor (optional) ---
  {% set sname = s.sensor_map[t] if t in s.sensor_map else s.sensor_pattern|replace('{n}', t|string) %}
  {% set sn = namespace(obj=none, label='no sensor') %}
  {% if sname %}
    {% if ("filament_switch_sensor " ~ sname) in printer %}
      {% set sn.obj = printer["filament_switch_sensor " ~ sname] %}
    {% elif ("filament_motion_sensor " ~ sname) in printer %}
      {% set sn.obj = printer["filament_motion_sensor " ~ sname] %}
    {% else %}
      {% set sn.label = 'sensor ' ~ sname ~ ' not found' %}
    {% endif %}
  {% endif %}
  {% if sn.obj is not none %}
    {% set sn.label = 'sensor ' ~ ('filament' if sn.obj.filament_detected else 'EMPTY') %}
  {% endif %}
  # --- temperature from the tool's profile ---
  {% set prof = v.get(k ~ "temp_profile")|default(v.get(k ~ "temp_type")|default(s.default_profile, true), true)|string|upper %}
  {% set tp = namespace(used=prof, temp=0, warn='') %}
  {% if prof == 'CUSTOM' %}
    {% if v.get(k ~ "custom_load_temp", none) is none %}
      {% set tp.used = 'HIGH' %}
      {% set tp.warn = 'CUSTOM selected but no custom load temp saved, using HIGH. Fix with SET_FILAMENT_TEMP TOOL=' ~ t ~ ' TYPE=CUSTOM LOAD_TEMP=...' %}
      {% set tp.temp = s.high_load_temp|float %}
    {% else %}
      {% set tp.temp = v[k ~ "custom_load_temp"]|float %}
    {% endif %}
  {% elif prof == 'HIGH' %}
    {% set tp.temp = s.high_load_temp|float %}
  {% else %}
    {% set tp.used = 'LOW' %}
    {% set tp.temp = s.low_load_temp|float %}
  {% endif %}
  # --- motion for this tool (saved override or default) ---
  {% set load_len = v.get(k ~ "load_length")|default(s.load_length, true)|float %}
  {% set load_spd = v.get(k ~ "load_speed")|default(s.load_speed, true)|float %}
  {% set purge = s.purge_length|float %}
  # After a nozzle change only the pulled-back length is fed again.
  {% set feed = partial_mm if partial and partial_mm > 0 else load_len %}
  # --- what to put back afterwards ---
  {% set prev = printer.toolhead.extruder %}
  {% set was_target = printer[ext].target|float %}
  {% set target = [was_target, tp.temp]|max %}
  {% set state = printer.print_stats.state %}
  # --- checks ---
  {% if state == "printing" %}
    { action_raise_error("FILAMENT_LOAD T%d: refused while printing. Pause first." % t) }
  {% endif %}
  {% if tp.temp > max_t or tp.temp < min_t %}
    { action_raise_error("FILAMENT_LOAD T%d: %s load temp %.0fC is outside %s limits %.0f to %.0fC" % (t, tp.used, tp.temp, ext, min_t, max_t)) }
  {% endif %}
  {% if target > max_t %}
    { action_raise_error("FILAMENT_LOAD T%d: %s target %.0fC is above max_temp %.0fC" % (t, ext, target, max_t)) }
  {% endif %}
  {% if load_len <= 0 or load_spd <= 0 %}
    { action_raise_error("FILAMENT_LOAD T%d: load length and speed must be above 0 (now %.1fmm at F%.0f)" % (t, load_len, load_spd)) }
  {% endif %}
  {% if not force and loaded %}
    { action_raise_error("FILAMENT_LOAD T%d: already marked loaded. Unload first, fix the flag with SET_FILAMENT_LOADED TOOL=%d LOADED=0, or add FORCE=1" % (t, t)) }
  {% endif %}
  {% if not force and sn.obj is not none and not sn.obj.filament_detected %}
    { action_raise_error("FILAMENT_LOAD T%d: the filament sensor reads empty. Insert filament up to the gears, or add FORCE=1" % t) }
  {% endif %}
  # --- go ---
  M117 Loading T{t}
  {% if state == "paused" %}
    RESPOND MSG="T{t} LOAD: printer is paused. Active extruder and heater targets are restored afterwards."
  {% endif %}
  {% if tp.warn %}
    RESPOND TYPE=error MSG="T{t} WARNING: {tp.warn}"
  {% endif %}
  RESPOND MSG="T{t} LOAD [1/5]: {tp.used} profile, heating {ext} to {target|int}C (now {printer[ext].temperature|round(1)}C) | {sn.label}"
  SET_HEATER_TEMPERATURE HEATER={ext} TARGET={target}
  TEMPERATURE_WAIT SENSOR={ext} MINIMUM={target - s.temp_tolerance|float}
  {% if partial %}
    RESPOND MSG="T{t} LOAD [2/5]: at temp, nozzle change reload, feeding back the {feed}mm pulled out at F{load_spd|int}"
  {% else %}
    RESPOND MSG="T{t} LOAD [2/5]: at temp, feeding {feed}mm at F{load_spd|int}"
  {% endif %}
  SAVE_GCODE_STATE NAME=_filament_load
  ACTIVATE_EXTRUDER EXTRUDER={ext}
  M83
  {% set pieces = (feed / max_move)|round(0, 'ceil')|int %}
  {% for i in range(pieces) %}
    G1 E{(feed / pieces)|round(3)} F{load_spd}
  {% endfor %}
  {% if purge > 0 %}
    RESPOND MSG="T{t} LOAD [3/5]: purging {purge}mm at F{s.purge_speed|int}"
    G1 E{purge} F{s.purge_speed}
  {% else %}
    RESPOND MSG="T{t} LOAD [3/5]: purge is 0, skipping"
  {% endif %}
  {% if s.load_retract|float > 0 %}
    G1 E-{s.load_retract|float} F{s.load_retract_speed}
  {% endif %}
  M400
  RESPOND MSG="T{t} LOAD [4/5]: restoring active extruder {prev} and {ext} target {was_target|int}C"
  ACTIVATE_EXTRUDER EXTRUDER={prev}
  RESTORE_GCODE_STATE NAME=_filament_load
  SET_HEATER_TEMPERATURE HEATER={ext} TARGET={was_target}
  SAVE_VARIABLE VARIABLE={k}loaded VALUE=True
  {% if v.get(k ~ "partial") is not none %}
    SAVE_VARIABLE VARIABLE={k}partial VALUE=False
  {% endif %}
  {% if v.get(k ~ "partial_mm") is not none %}
    SAVE_VARIABLE VARIABLE={k}partial_mm VALUE=None
  {% endif %}
  M117 T{t} loaded
  RESPOND MSG="T{t} LOAD [5/5]: done, T{t} marked loaded"


#####################################################################
#  FILAMENT_UNLOAD TOOL=n
#  Heat to the profile unload temp, push unload_tip_push to soften
#  the tip, retract unload_length fast, mark it empty, restore the
#  heater target and active extruder. Always allowed when not
#  printing (it is harmless on an empty tool and clears stuck tails).
#####################################################################
[gcode_macro FILAMENT_UNLOAD]
description: Unload filament from one tool. Options: TOOL=n (required). Example: FILAMENT_UNLOAD TOOL=0
gcode:
  {% set _hint = params.TOOL|default('tool number, e.g. 0') %}
  {% set args = params %}
  {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
  {% if args.TOOL is not defined %}
    { action_raise_error("FILAMENT_UNLOAD: TOOL= is required, e.g. FILAMENT_UNLOAD TOOL=0") }
  {% endif %}
  {% set t = args.TOOL|int %}
  # --- find the tool by its tool_number (not its list position) ---
  {% set tl = namespace(name='') %}
  {% for n in printer.toolchanger.tool_names %}
    {% if printer[n].tool_number == t %}{% set tl.name = n %}{% endif %}
  {% endfor %}
  {% if tl.name == '' %}
    { action_raise_error("FILAMENT_UNLOAD: there is no tool T%d. Known tools: %s" % (t, printer.toolchanger.tool_numbers|join(', '))) }
  {% endif %}
  {% set ext = printer[tl.name].extruder %}
  {% if not ext %}
    { action_raise_error("FILAMENT_UNLOAD: T%d has no extruder set in its [tool] section" % t) }
  {% endif %}
  {% set cfg = printer.configfile.settings[ext] %}
  {% set max_t = cfg.max_temp|float %}
  {% set min_t = cfg.min_extrude_temp|default(170)|float %}
  {% set max_move = [s.max_move_length|float, cfg.max_extrude_only_distance|default(50)|float]|min %}
  {% set v = printer.save_variables.variables %}
  {% set k = "t" ~ t ~ "_" %}
  {% set loaded = v.get(k ~ "loaded")|default(False, true) %}
  {% set partial = v.get(k ~ "partial")|default(False, true) %}
  {% set partial_mm = v.get(k ~ "partial_mm")|default(0, true)|float %}
  # --- temperature from the tool's profile ---
  {% set prof = v.get(k ~ "temp_profile")|default(v.get(k ~ "temp_type")|default(s.default_profile, true), true)|string|upper %}
  {% set tp = namespace(used=prof, temp=0, warn='') %}
  {% if prof == 'CUSTOM' %}
    {% if v.get(k ~ "custom_unload_temp", none) is none %}
      {% set tp.used = 'HIGH' %}
      {% set tp.warn = 'CUSTOM selected but no custom unload temp saved, using HIGH. Fix with SET_FILAMENT_TEMP TOOL=' ~ t ~ ' TYPE=CUSTOM UNLOAD_TEMP=...' %}
      {% set tp.temp = s.high_unload_temp|float %}
    {% else %}
      {% set tp.temp = v[k ~ "custom_unload_temp"]|float %}
    {% endif %}
  {% elif prof == 'HIGH' %}
    {% set tp.temp = s.high_unload_temp|float %}
  {% else %}
    {% set tp.used = 'LOW' %}
    {% set tp.temp = s.low_unload_temp|float %}
  {% endif %}
  # --- motion for this tool (saved override or default) ---
  {% set un_len = v.get(k ~ "unload_length")|default(s.unload_length, true)|float %}
  {% set un_spd = v.get(k ~ "unload_speed")|default(s.unload_speed, true)|float %}
  {% set tip = s.unload_tip_push|float %}
  # After a nozzle change (partial unload) the tip is already shaped
  # and partial_mm out of the nozzle, so skip the tip push and only
  # retract what is left of the normal unload length.
  {% if partial %}
    {% set tip = 0 %}
    {% set un_len = [un_len - partial_mm, 0]|max %}
  {% endif %}
  {% set prev = printer.toolhead.extruder %}
  {% set was_target = printer[ext].target|float %}
  {% set target = [was_target, tp.temp]|max %}
  {% set state = printer.print_stats.state %}
  # --- checks ---
  {% if state == "printing" %}
    { action_raise_error("FILAMENT_UNLOAD T%d: refused while printing. Pause first." % t) }
  {% endif %}
  {% if tp.temp > max_t or tp.temp < min_t %}
    { action_raise_error("FILAMENT_UNLOAD T%d: %s unload temp %.0fC is outside %s limits %.0f to %.0fC" % (t, tp.used, tp.temp, ext, min_t, max_t)) }
  {% endif %}
  {% if target > max_t %}
    { action_raise_error("FILAMENT_UNLOAD T%d: %s target %.0fC is above max_temp %.0fC" % (t, ext, target, max_t)) }
  {% endif %}
  {% if (un_len <= 0 and not partial) or un_spd <= 0 %}
    { action_raise_error("FILAMENT_UNLOAD T%d: unload length and speed must be above 0 (now %.1fmm at F%.0f)" % (t, un_len, un_spd)) }
  {% endif %}
  # --- go ---
  M117 Unloading T{t}
  {% if partial %}
    RESPOND MSG="T{t} UNLOAD: T{t} was partly unloaded for a nozzle change, {partial_mm}mm already out, retracting the remaining {un_len}mm"
  {% elif not loaded %}
    RESPOND MSG="T{t} UNLOAD: T{t} is marked empty, unloading anyway to clear any filament left in the tool"
  {% endif %}
  {% if tp.warn %}
    RESPOND TYPE=error MSG="T{t} WARNING: {tp.warn}"
  {% endif %}
  RESPOND MSG="T{t} UNLOAD [1/5]: {tp.used} profile, heating {ext} to {target|int}C (now {printer[ext].temperature|round(1)}C)"
  SET_HEATER_TEMPERATURE HEATER={ext} TARGET={target}
  TEMPERATURE_WAIT SENSOR={ext} MINIMUM={target - s.temp_tolerance|float}
  SAVE_GCODE_STATE NAME=_filament_unload
  ACTIVATE_EXTRUDER EXTRUDER={ext}
  M83
  {% if tip > 0 %}
    RESPOND MSG="T{t} UNLOAD [2/5]: at temp, pushing {tip}mm to soften the tip"
    G1 E{tip} F{s.unload_tip_speed}
  {% else %}
    RESPOND MSG="T{t} UNLOAD [2/5]: at temp, tip push is 0, skipping"
  {% endif %}
  {% set pieces = (un_len / max_move)|round(0, 'ceil')|int %}
  {% if pieces > 0 %}
    RESPOND MSG="T{t} UNLOAD [3/5]: retracting {un_len}mm at F{un_spd|int} in {pieces} moves"
  {% else %}
    RESPOND MSG="T{t} UNLOAD [3/5]: nothing left to retract"
  {% endif %}
  {% for i in range(pieces) %}
    G1 E-{(un_len / pieces)|round(3)} F{un_spd}
  {% endfor %}
  M400
  RESPOND MSG="T{t} UNLOAD [4/5]: restoring active extruder {prev} and {ext} target {was_target|int}C"
  ACTIVATE_EXTRUDER EXTRUDER={prev}
  RESTORE_GCODE_STATE NAME=_filament_unload
  SET_HEATER_TEMPERATURE HEATER={ext} TARGET={was_target}
  SAVE_VARIABLE VARIABLE={k}loaded VALUE=False
  {% if v.get(k ~ "partial") is not none %}
    SAVE_VARIABLE VARIABLE={k}partial VALUE=False
  {% endif %}
  {% if v.get(k ~ "partial_mm") is not none %}
    SAVE_VARIABLE VARIABLE={k}partial_mm VALUE=None
  {% endif %}
  M117 T{t} unloaded
  RESPOND MSG="T{t} UNLOAD [5/5]: done, T{t} marked empty. Pull the filament out."


#####################################################################
#  FILAMENT_UNLOAD_PARTIAL TOOL=n [LENGTH=mm] [FORCE=1]
#  Nozzle change: heat to the profile unload temp, push
#  unload_tip_push to soften the tip (same start as FILAMENT_UNLOAD),
#  then pull back only partial_unload_length (or the tool's
#  PARTIAL_LENGTH, or LENGTH=). The tip leaves the nozzle and heat
#  break but stays gripped in the extruder gears. The heater is then
#  turned OFF so the hotend cools for the swap.
#  Saves tn_partial = True, tn_partial_mm = the pull-back, and
#  tn_loaded = False. FILAMENT_LOAD then feeds back only that length
#  plus the normal purge. FILAMENT_UNLOAD retracts only the rest.
#  Refuses while printing or paused (a new nozzle changes the tool
#  offsets), when already partial, or when the tool reads empty
#  (FORCE=1 skips the empty check).
#####################################################################
[gcode_macro FILAMENT_UNLOAD_PARTIAL]
description: Nozzle change. Pulls the filament out of the nozzle but keeps it in the extruder gears, then turns the heater off. FILAMENT_LOAD feeds it back. Options: TOOL=n (required), LENGTH= mm to pull back, FORCE=1 skips the empty check. Example: FILAMENT_UNLOAD_PARTIAL TOOL=0
gcode:
  {% set _hint = params.TOOL|default('tool number, e.g. 0') %}
  {% set _hint = params.LENGTH|default('mm to pull back, blank = saved or default') %}
  {% set _hint = params.FORCE|default('1 = skip the empty check') %}
  {% set args = params %}
  {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
  {% if args.TOOL is not defined %}
    { action_raise_error("FILAMENT_UNLOAD_PARTIAL: TOOL= is required, e.g. FILAMENT_UNLOAD_PARTIAL TOOL=0") }
  {% endif %}
  {% set t = args.TOOL|int %}
  {% set force = args.FORCE|default(0)|int == 1 %}
  {% set tl = namespace(name='') %}
  {% for n in printer.toolchanger.tool_names %}
    {% if printer[n].tool_number == t %}{% set tl.name = n %}{% endif %}
  {% endfor %}
  {% if tl.name == '' %}
    { action_raise_error("FILAMENT_UNLOAD_PARTIAL: there is no tool T%d. Known tools: %s" % (t, printer.toolchanger.tool_numbers|join(', '))) }
  {% endif %}
  {% set ext = printer[tl.name].extruder %}
  {% if not ext %}
    { action_raise_error("FILAMENT_UNLOAD_PARTIAL: T%d has no extruder set in its [tool] section" % t) }
  {% endif %}
  {% set cfg = printer.configfile.settings[ext] %}
  {% set max_t = cfg.max_temp|float %}
  {% set min_t = cfg.min_extrude_temp|default(170)|float %}
  {% set max_move = [s.max_move_length|float, cfg.max_extrude_only_distance|default(50)|float]|min %}
  {% set v = printer.save_variables.variables %}
  {% set k = "t" ~ t ~ "_" %}
  {% set loaded = v.get(k ~ "loaded")|default(False, true) %}
  {% set partial = v.get(k ~ "partial")|default(False, true) %}
  # --- sensor (optional), same lookup as FILAMENT_LOAD ---
  {% set sname = s.sensor_map[t] if t in s.sensor_map else s.sensor_pattern|replace('{n}', t|string) %}
  {% set sn = namespace(obj=none) %}
  {% if sname %}
    {% if ("filament_switch_sensor " ~ sname) in printer %}
      {% set sn.obj = printer["filament_switch_sensor " ~ sname] %}
    {% elif ("filament_motion_sensor " ~ sname) in printer %}
      {% set sn.obj = printer["filament_motion_sensor " ~ sname] %}
    {% endif %}
  {% endif %}
  # --- temperature: the tool's UNLOAD temp from its profile ---
  {% set prof = v.get(k ~ "temp_profile")|default(v.get(k ~ "temp_type")|default(s.default_profile, true), true)|string|upper %}
  {% set tp = namespace(used=prof, temp=0, warn='') %}
  {% if prof == 'CUSTOM' %}
    {% if v.get(k ~ "custom_unload_temp", none) is none %}
      {% set tp.used = 'HIGH' %}
      {% set tp.warn = 'CUSTOM selected but no custom unload temp saved, using HIGH. Fix with SET_FILAMENT_TEMP TOOL=' ~ t ~ ' TYPE=CUSTOM UNLOAD_TEMP=...' %}
      {% set tp.temp = s.high_unload_temp|float %}
    {% else %}
      {% set tp.temp = v[k ~ "custom_unload_temp"]|float %}
    {% endif %}
  {% elif prof == 'HIGH' %}
    {% set tp.temp = s.high_unload_temp|float %}
  {% else %}
    {% set tp.used = 'LOW' %}
    {% set tp.temp = s.low_unload_temp|float %}
  {% endif %}
  # --- lengths: LENGTH=, else the tool's saved PARTIAL_LENGTH, else the default ---
  {% set load_len = v.get(k ~ "load_length")|default(s.load_length, true)|float %}
  {% set pl = args.LENGTH|default(v.get(k ~ "partial_length")|default(s.partial_unload_length, true))|float %}
  {% set limit = load_len - s.partial_margin|float %}
  {% set un_spd = v.get(k ~ "unload_speed")|default(s.unload_speed, true)|float %}
  {% set tip = s.unload_tip_push|float %}
  {% set prev = printer.toolhead.extruder %}
  {% set state = printer.print_stats.state %}
  # --- checks ---
  {% if state == "printing" or state == "paused" %}
    { action_raise_error("FILAMENT_UNLOAD_PARTIAL T%d: refused while the printer is %s. A nozzle change needs new tool offsets, so finish or cancel the print first." % (t, state)) }
  {% endif %}
  {% if partial %}
    { action_raise_error("FILAMENT_UNLOAD_PARTIAL T%d: already partly unloaded, %smm out. Run FILAMENT_LOAD TOOL=%d to feed it back, or FILAMENT_UNLOAD TOOL=%d to take it all out" % (t, v.get(k ~ 'partial_mm'), t, t)) }
  {% endif %}
  {% if not force and sn.obj is not none and not sn.obj.filament_detected %}
    { action_raise_error("FILAMENT_UNLOAD_PARTIAL T%d: the filament sensor reads empty, there is nothing to pull back. Add FORCE=1 to run it anyway" % t) }
  {% endif %}
  {% if not force and sn.obj is none and not loaded %}
    { action_raise_error("FILAMENT_UNLOAD_PARTIAL T%d: the tool is marked empty. Mark it loaded with SET_FILAMENT_LOADED TOOL=%d LOADED=1, or add FORCE=1" % (t, t)) }
  {% endif %}
  {% if pl < 5 or pl > limit %}
    { action_raise_error("FILAMENT_UNLOAD_PARTIAL T%d: pull-back %.1fmm rejected. It must be 5 to %.1fmm, the load length %.1fmm minus partial_margin %.1fmm, so the filament stays in the gears" % (t, pl, limit, load_len, s.partial_margin|float)) }
  {% endif %}
  {% if tp.temp > max_t or tp.temp < min_t %}
    { action_raise_error("FILAMENT_UNLOAD_PARTIAL T%d: %s unload temp %.0fC is outside %s limits %.0f to %.0fC" % (t, tp.used, tp.temp, ext, min_t, max_t)) }
  {% endif %}
  # --- go ---
  M117 Nozzle change T{t}
  {% if tp.warn %}
    RESPOND TYPE=error MSG="T{t} WARNING: {tp.warn}"
  {% endif %}
  RESPOND MSG="T{t} NOZZLE CHANGE [1/4]: {tp.used} profile, heating {ext} to {tp.temp|int}C (now {printer[ext].temperature|round(1)}C)"
  SET_HEATER_TEMPERATURE HEATER={ext} TARGET={tp.temp}
  TEMPERATURE_WAIT SENSOR={ext} MINIMUM={tp.temp - s.temp_tolerance|float}
  SAVE_GCODE_STATE NAME=_filament_partial
  ACTIVATE_EXTRUDER EXTRUDER={ext}
  M83
  {% if tip > 0 %}
    RESPOND MSG="T{t} NOZZLE CHANGE [2/4]: at temp, pushing {tip}mm to soften the tip"
    G1 E{tip} F{s.unload_tip_speed}
  {% else %}
    RESPOND MSG="T{t} NOZZLE CHANGE [2/4]: at temp, tip push is 0, skipping"
  {% endif %}
  {% set pieces = (pl / max_move)|round(0, 'ceil')|int %}
  RESPOND MSG="T{t} NOZZLE CHANGE [3/4]: pulling back {pl}mm at F{un_spd|int}, the filament stays in the gears"
  {% for i in range(pieces) %}
    G1 E-{(pl / pieces)|round(3)} F{un_spd}
  {% endfor %}
  M400
  ACTIVATE_EXTRUDER EXTRUDER={prev}
  RESTORE_GCODE_STATE NAME=_filament_partial
  SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
  SAVE_VARIABLE VARIABLE={k}loaded VALUE=False
  SAVE_VARIABLE VARIABLE={k}partial VALUE=True
  SAVE_VARIABLE VARIABLE={k}partial_mm VALUE={pl}
  M117 T{t} ready for nozzle change
  RESPOND MSG="T{t} NOZZLE CHANGE [4/4]: done, {ext} heater OFF and cooling. Swap the nozzle, then FILAMENT_LOAD TOOL={t} feeds {pl}mm back and purges. New nozzle: recalibrate the tool offsets."


#####################################################################
#  SET_FILAMENT_LOADED TOOL=n LOADED=0|1
#  Fix the saved flag without moving filament, e.g. after loading or
#  pulling filament by hand. Needed most on tools without a sensor.
#####################################################################
[gcode_macro SET_FILAMENT_LOADED]
description: Mark a tool loaded or empty without moving filament, also clears a nozzle change state. Options: TOOL=n, LOADED=1 (loaded) or 0 (empty). Example: SET_FILAMENT_LOADED TOOL=2 LOADED=0
gcode:
  {% set _hint = params.TOOL|default('tool number, e.g. 0') %}
  {% set _hint = params.LOADED|default('1 = loaded, 0 = empty') %}
  {% set args = params %}
  {% if args.TOOL is not defined or args.LOADED is not defined %}
    { action_raise_error("SET_FILAMENT_LOADED: use SET_FILAMENT_LOADED TOOL=n LOADED=0|1") }
  {% endif %}
  {% set t = args.TOOL|int %}
  {% if t not in printer.toolchanger.tool_numbers %}
    { action_raise_error("SET_FILAMENT_LOADED: there is no tool T%d. Known tools: %s" % (t, printer.toolchanger.tool_numbers|join(', '))) }
  {% endif %}
  {% set on = args.LOADED|int == 1 %}
  {% set v = printer.save_variables.variables %}
  {% set was_partial = v.get('t' ~ t ~ '_partial')|default(False, true) %}
  SAVE_VARIABLE VARIABLE=t{t}_loaded VALUE={on}
  {% if v.get('t' ~ t ~ '_partial') is not none %}
    SAVE_VARIABLE VARIABLE=t{t}_partial VALUE=False
  {% endif %}
  {% if v.get('t' ~ t ~ '_partial_mm') is not none %}
    SAVE_VARIABLE VARIABLE=t{t}_partial_mm VALUE=None
  {% endif %}
  RESPOND MSG="Tool T{t}: marked {'loaded' if on else 'empty'} (no filament moved){', nozzle change state cleared' if was_partial else ''}"


#####################################################################
#  SET_FILAMENT_TEMP TOOL=n TYPE=HIGH|LOW|CUSTOM
#                    [TEMP=t] [LOAD_TEMP=t] [UNLOAD_TEMP=t]
#  Pick the tool's temperature profile. HIGH / LOW use the global
#  temps in _FILAMENT_SETTINGS. CUSTOM saves per-tool temps:
#    TEMP=225          same temp for load and unload
#    LOAD_TEMP / UNLOAD_TEMP  set them separately
#  Custom temps must be between the extruder's min_extrude_temp and
#  max_temp. If CUSTOM has no saved temp, load/unload use HIGH and warn.
#####################################################################
[gcode_macro SET_FILAMENT_TEMP]
description: Set a tool temp profile. Options: TOOL=n, TYPE=HIGH, LOW or CUSTOM, CUSTOM temps TEMP= (both), LOAD_TEMP=, UNLOAD_TEMP= in C. Example: SET_FILAMENT_TEMP TOOL=1 TYPE=CUSTOM TEMP=225
gcode:
  {% set _hint = params.TOOL|default('tool number, e.g. 0') %}
  {% set _hint = params.TYPE|default('HIGH, LOW or CUSTOM') %}
  {% set _hint = params.TEMP|default('CUSTOM load and unload C, e.g. 225') %}
  {% set _hint = params.LOAD_TEMP|default('CUSTOM load C, e.g. 230') %}
  {% set _hint = params.UNLOAD_TEMP|default('CUSTOM unload C, e.g. 220') %}
  {% set args = params %}
  {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
  {% if args.TOOL is not defined %}
    { action_raise_error("SET_FILAMENT_TEMP: TOOL= is required") }
  {% endif %}
  {% set t = args.TOOL|int %}
  {% set type = args.TYPE|default('')|upper %}
  {% if type == '' and (args.TEMP is defined or args.LOAD_TEMP is defined or args.UNLOAD_TEMP is defined) %}
    {% set type = 'CUSTOM' %}
  {% endif %}
  {% if type not in ['HIGH', 'LOW', 'CUSTOM'] %}
    { action_raise_error("SET_FILAMENT_TEMP: TYPE must be HIGH, LOW or CUSTOM, got '%s'. This sets the temperature profile, not the material. Set the material with SET_TOOL_FILAMENT TOOL=n MATERIAL=PETG" % type) }
  {% endif %}
  {% set tl = namespace(name='') %}
  {% for n in printer.toolchanger.tool_names %}
    {% if printer[n].tool_number == t %}{% set tl.name = n %}{% endif %}
  {% endfor %}
  {% if tl.name == '' %}
    { action_raise_error("SET_FILAMENT_TEMP: there is no tool T%d. Known tools: %s" % (t, printer.toolchanger.tool_numbers|join(', '))) }
  {% endif %}
  {% set ext = printer[tl.name].extruder %}
  {% set cfg = printer.configfile.settings[ext] %}
  {% set max_t = cfg.max_temp|float %}
  {% set min_t = cfg.min_extrude_temp|default(170)|float %}
  {% set v = printer.save_variables.variables %}
  {% set k = "t" ~ t ~ "_" %}
  {% set lt = args.LOAD_TEMP|default(args.TEMP|default(-1))|float %}
  {% set ut = args.UNLOAD_TEMP|default(args.TEMP|default(-1))|float %}
  {% if type == 'CUSTOM' %}
    {% for pair in [['load', lt], ['unload', ut]] %}
      {% if pair[1] != -1 and (pair[1] > max_t or pair[1] < min_t) %}
        { action_raise_error("SET_FILAMENT_TEMP T%d: custom %s temp %.0fC rejected, %s allows %.0f to %.0fC" % (t, pair[0], pair[1], ext, min_t, max_t)) }
      {% endif %}
    {% endfor %}
  {% endif %}
  SAVE_VARIABLE VARIABLE={k}temp_profile VALUE='"{type}"'
  {% if type == 'CUSTOM' %}
    {% if lt != -1 %}
      SAVE_VARIABLE VARIABLE={k}custom_load_temp VALUE={lt|int}
    {% endif %}
    {% if ut != -1 %}
      SAVE_VARIABLE VARIABLE={k}custom_unload_temp VALUE={ut|int}
    {% endif %}
    {% set show_l = (lt|int|string ~ 'C') if lt != -1 else ((v.get(k ~ "custom_load_temp")|string ~ 'C') if v.get(k ~ "custom_load_temp") is not none else 'not set') %}
    {% set show_u = (ut|int|string ~ 'C') if ut != -1 else ((v.get(k ~ "custom_unload_temp")|string ~ 'C') if v.get(k ~ "custom_unload_temp") is not none else 'not set') %}
    RESPOND MSG="Tool T{t}: CUSTOM profile, load {show_l}, unload {show_u}"
    {% if show_l == 'not set' or show_u == 'not set' %}
      RESPOND TYPE=error MSG="T{t} WARNING: a custom temp is not set, that step will use HIGH. Add TEMP=, LOAD_TEMP= or UNLOAD_TEMP="
    {% endif %}
  {% elif type == 'HIGH' %}
    RESPOND MSG="Tool T{t}: HIGH profile, load {s.high_load_temp}C, unload {s.high_unload_temp}C"
  {% else %}
    RESPOND MSG="Tool T{t}: LOW profile, load {s.low_load_temp}C, unload {s.low_unload_temp}C"
  {% endif %}


#####################################################################
#  SET_FILAMENT_MOTION TOOL=n [LOAD_LENGTH=] [LOAD_SPEED=]
#                      [UNLOAD_LENGTH=] [UNLOAD_SPEED=] [RESET=1]
#  Per-tool lengths (mm) and speeds (mm/min) that override the
#  defaults in _FILAMENT_SETTINGS. RESET=1 goes back to the defaults.
#  With no other parameters it just shows the current values.
#####################################################################
[gcode_macro SET_FILAMENT_MOTION]
description: Per-tool load and unload moves. Options: TOOL=n, LOAD_LENGTH=, UNLOAD_LENGTH= and PARTIAL_LENGTH= (nozzle change) in mm, LOAD_SPEED= and UNLOAD_SPEED= in mm/min, RESET=1 for defaults. TOOL alone shows the values. Example: SET_FILAMENT_MOTION TOOL=1 LOAD_LENGTH=80
gcode:
  {% set _hint = params.TOOL|default('tool number, e.g. 0') %}
  {% set _hint = params.LOAD_LENGTH|default('mm, e.g. 60') %}
  {% set _hint = params.LOAD_SPEED|default('mm/min, e.g. 300') %}
  {% set _hint = params.UNLOAD_LENGTH|default('mm, e.g. 150') %}
  {% set _hint = params.UNLOAD_SPEED|default('mm/min, e.g. 7200') %}
  {% set _hint = params.PARTIAL_LENGTH|default('nozzle change pull-back mm, e.g. 35') %}
  {% set _hint = params.RESET|default('1 = back to defaults') %}
  {% set args = params %}
  {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
  {% if args.TOOL is not defined %}
    { action_raise_error("SET_FILAMENT_MOTION: TOOL= is required") }
  {% endif %}
  {% set t = args.TOOL|int %}
  {% if t not in printer.toolchanger.tool_numbers %}
    { action_raise_error("SET_FILAMENT_MOTION: there is no tool T%d. Known tools: %s" % (t, printer.toolchanger.tool_numbers|join(', '))) }
  {% endif %}
  {% set k = "t" ~ t ~ "_" %}
  {% set v = printer.save_variables.variables %}
  {% set fields = [['LOAD_LENGTH', 'load_length', 1, 2000], ['LOAD_SPEED', 'load_speed', 10, 12000], ['UNLOAD_LENGTH', 'unload_length', 1, 2000], ['UNLOAD_SPEED', 'unload_speed', 10, 12000], ['PARTIAL_LENGTH', 'partial_length', 1, 2000]] %}
  {% set nv = namespace(new={}) %}
  {% for f in fields %}
    {% if args[f[0]] is defined %}
      {% set val = args[f[0]]|float %}
      {% if val < f[2] or val > f[3] %}
        { action_raise_error("SET_FILAMENT_MOTION T%d: %s=%s is out of range %d to %d" % (t, f[0], args[f[0]], f[2], f[3])) }
      {% endif %}
      {% set _ = nv.new.update({f[1]: val}) %}
    {% endif %}
  {% endfor %}
  {% if args.RESET|default(0)|int == 1 %}
    {% for f in fields %}
      {% if v.get(k ~ f[1]) is not none %}
        SAVE_VARIABLE VARIABLE={k}{f[1]} VALUE=None
      {% endif %}
    {% endfor %}
    RESPOND MSG="Tool T{t}: motion reset to defaults | load {s.load_length}mm F{s.load_speed} | unload {s.unload_length}mm F{s.unload_speed} | nozzle change {s.partial_unload_length}mm"
  {% else %}
    {% for key in nv.new %}
      SAVE_VARIABLE VARIABLE={k}{key} VALUE={nv.new[key]}
    {% endfor %}
    {% set ll = nv.new.get('load_length', v.get(k ~ 'load_length')|default(s.load_length, true)) %}
    {% set ls = nv.new.get('load_speed', v.get(k ~ 'load_speed')|default(s.load_speed, true)) %}
    {% set ul = nv.new.get('unload_length', v.get(k ~ 'unload_length')|default(s.unload_length, true)) %}
    {% set us = nv.new.get('unload_speed', v.get(k ~ 'unload_speed')|default(s.unload_speed, true)) %}
    {% set pl = nv.new.get('partial_length', v.get(k ~ 'partial_length')|default(s.partial_unload_length, true)) %}
    RESPOND MSG="Tool T{t}: {'saved' if nv.new else 'current'} motion | load {ll}mm F{ls} | unload {ul}mm F{us} | nozzle change {pl}mm"
  {% endif %}


#####################################################################
#  SET_TOOL_FILAMENT TOOL=n [MATERIAL=] [COLOR=] [SPOOL=] [PROFILE=] [CLEAR=1]
#  Spool info used by SHOW_TOOLS, the GUI and (later) endless spool.
#  Saved in variables.cfg ONLY. It never touches the T# macro
#  variable_color, which KTC-Easy uses for its own active-tool colour.
#    COLOR is 6 hex digits, with or without the leading hash.
#    SPOOL="Polymaker grey 1kg" (quotes needed if it has spaces)
#    PROFILE=HIGH|LOW|CUSTOM, or a number like 240 for CUSTOM with that
#    temp, is passed on to SET_FILAMENT_TEMP.
#####################################################################
[gcode_macro SET_TOOL_FILAMENT]
description: Set spool info for a tool. Options: TOOL=n, MATERIAL=PETG, COLOR=FF8800 (no hash), SPOOL=name, PROFILE=HIGH, LOW, CUSTOM or a temp like 240, CLEAR=1. Blank fields are left alone. Example: SET_TOOL_FILAMENT TOOL=1 MATERIAL=PETG COLOR=FF8800 PROFILE=HIGH
gcode:
  {% set _hint = params.TOOL|default('tool number, e.g. 0') %}
  {% set _hint = params.MATERIAL|default('PLA, PETG, ABS, ASA...') %}
  {% set _hint = params.COLOR|default('6 hex digits, no hash, e.g. FF8800') %}
  {% set _hint = params.SPOOL|default('spool name, e.g. Sunlu grey 1kg') %}
  {% set _hint = params.PROFILE|default('HIGH, LOW, CUSTOM or a temp like 240') %}
  {% set _hint = params.CLEAR|default('1 = clear material, colour, spool') %}
  {% set args = params %}
  {% if args.TOOL is not defined %}
    { action_raise_error("SET_TOOL_FILAMENT: TOOL= is required") }
  {% endif %}
  {% set t = args.TOOL|int %}
  {% if t not in printer.toolchanger.tool_numbers %}
    { action_raise_error("SET_TOOL_FILAMENT: there is no tool T%d. Known tools: %s" % (t, printer.toolchanger.tool_numbers|join(', '))) }
  {% endif %}
  # PROFILE: HIGH, LOW, CUSTOM, or a number, which sets CUSTOM with that load and unload temp.
  # Checked here, BEFORE anything is saved, so a wrong value changes
  # nothing.
  {% set prof = args.PROFILE|default('')|string|upper|trim %}
  {% set num = namespace(ok=(prof|length > 0)) %}
  {% for c in prof %}
    {% if c not in '0123456789.' %}{% set num.ok = False %}{% endif %}
  {% endfor %}
  {% if prof != '' and prof not in ['HIGH', 'LOW', 'CUSTOM'] and not num.ok %}
    { action_raise_error("SET_TOOL_FILAMENT T%d: PROFILE must be HIGH, LOW, CUSTOM or a temperature like 240, got '%s'. Nothing was saved. The material name (PLA, PETG...) goes in MATERIAL." % (t, prof)) }
  {% endif %}
  {% set k = "t" ~ t ~ "_" %}
  {% if args.CLEAR|default(0)|int == 1 %}
    {% for f in ['material', 'color', 'spool'] %}
      {% if printer.save_variables.variables.get(k ~ f) is not none %}
        SAVE_VARIABLE VARIABLE={k}{f} VALUE=None
      {% endif %}
    {% endfor %}
    RESPOND MSG="Tool T{t}: material, colour and spool name cleared"
  {% endif %}
  {% if args.MATERIAL is defined %}
    {% set mat = args.MATERIAL|upper|replace('"', '')|replace("'", '') %}
    SAVE_VARIABLE VARIABLE={k}material VALUE='"{mat}"'
    RESPOND MSG="Tool T{t}: material {mat}"
  {% endif %}
  {% if args.COLOR is defined %}
    {% set col = args.COLOR|upper|trim %}
    {% set hexok = namespace(ok=(col|length == 6)) %}
    {% for c in col %}
      {% if c not in '0123456789ABCDEF' %}{% set hexok.ok = False %}{% endif %}
    {% endfor %}
    {% if col == '' %}
      { action_raise_error("SET_TOOL_FILAMENT T%d: COLOR is empty. Type it without the hash sign, e.g. COLOR=FF0000 (Klipper reads a hash as the start of a comment)" % t) }
    {% elif not hexok.ok %}
      { action_raise_error("SET_TOOL_FILAMENT T%d: COLOR must be 6 hex digits like FF0000, got '%s'" % (t, args.COLOR)) }
    {% endif %}
    SAVE_VARIABLE VARIABLE={k}color VALUE='"{col}"'
    RESPOND MSG="Tool T{t}: colour {col}"
  {% endif %}
  {% if args.SPOOL is defined %}
    {% set sp = args.SPOOL|replace('"', '')|replace("'", '')|trim %}
    SAVE_VARIABLE VARIABLE={k}spool VALUE='"{sp}"'
    RESPOND MSG="Tool T{t}: spool name {sp}"
    # a different spool name = a new spool: zero the usage add-on counter
    {% if 'gcode_macro RESET_TOOL_USAGE' in printer and (printer.save_variables.variables.get(k ~ 'spool') or '')|string != sp %}
      RESET_TOOL_USAGE TOOL={t} QUIET=1
    {% endif %}
  {% endif %}
  {% if num.ok %}
    SET_FILAMENT_TEMP TOOL={t} TYPE=CUSTOM TEMP={prof}
  {% elif prof != '' %}
    SET_FILAMENT_TEMP TOOL={t} TYPE={prof}
  {% endif %}


#####################################################################
#  SHOW_TOOLS
#  One console line per tool: spool info, temp profile, motion,
#  saved loaded flag and live sensor state. Flags a mismatch when a
#  sensor reads empty but the tool is still marked loaded.
#####################################################################
[gcode_macro SHOW_TOOLS]
description: Show spool info, temp profile, motion and loaded/sensor state for every tool. No options. Example: SHOW_TOOLS
gcode:
  {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
  {% set v = printer.save_variables.variables %}
  {% set tc = printer.toolchanger %}
  RESPOND MSG="ktc-filament v{s.module_version} | {tc.tool_numbers|length} tools | active T{tc.tool_number} | HIGH {s.high_load_temp}/{s.high_unload_temp}C, LOW {s.low_load_temp}/{s.low_unload_temp}C (load/unload)"
  {% for name in tc.tool_names %}
    {% set t = printer[name].tool_number %}
    {% set k = "t" ~ t ~ "_" %}
    {% set prof = v.get(k ~ "temp_profile")|default(v.get(k ~ "temp_type")|default(s.default_profile, true), true)|string|upper %}
    {% if prof == 'CUSTOM' %}
      {% set cl = v.get(k ~ 'custom_load_temp') %}{% set cu = v.get(k ~ 'custom_unload_temp') %}
      {% set ptxt = 'CUSTOM ' ~ ((cl|string ~ 'C') if cl is not none else 'HIGH') ~ '/' ~ ((cu|string ~ 'C') if cu is not none else 'HIGH') %}
    {% else %}
      {% set ptxt = prof %}
    {% endif %}
    {% set loaded = v.get(k ~ "loaded")|default(False, true) %}
    {% set partial = v.get(k ~ "partial")|default(False, true) %}
    {% set ltxt = ('PARTIAL nozzle change, ' ~ v.get(k ~ 'partial_mm')|default(0, true) ~ 'mm out') if partial else ('LOADED' if loaded else 'empty') %}
    {% set sname = s.sensor_map[t] if t in s.sensor_map else s.sensor_pattern|replace('{n}', t|string) %}
    {% set sn = namespace(txt='no sensor, flag only') %}
    {% if sname %}
      {% if ("filament_switch_sensor " ~ sname) in printer %}
        {% set so = printer["filament_switch_sensor " ~ sname] %}
        {% set sn.txt = 'sensor ' ~ ('filament' if so.filament_detected else 'empty') ~ ('' if so.enabled else ' (disabled)') %}
        {% if loaded and not so.filament_detected %}{% set sn.txt = sn.txt ~ ' MISMATCH, marked loaded' %}{% endif %}
        {% if partial and not so.filament_detected %}{% set sn.txt = sn.txt ~ ' MISMATCH, marked partial' %}{% endif %}
      {% elif ("filament_motion_sensor " ~ sname) in printer %}
        {% set so = printer["filament_motion_sensor " ~ sname] %}
        {% set sn.txt = 'motion sensor ' ~ ('filament' if so.filament_detected else 'empty') %}
      {% else %}
        {% set sn.txt = 'sensor ' ~ sname ~ ' NOT FOUND' %}
      {% endif %}
    {% endif %}
    {% set custom_motion = v.get(k ~ 'load_length') is not none or v.get(k ~ 'load_speed') is not none or v.get(k ~ 'unload_length') is not none or v.get(k ~ 'unload_speed') is not none or v.get(k ~ 'partial_length') is not none %}
    RESPOND MSG="T{t} | {v.get(k ~ 'material')|default('-', true)} {v.get(k ~ 'color')|default('-', true)} {v.get(k ~ 'spool')|default('', true)} | {ptxt} | {ltxt} | {sn.txt} | load {v.get(k ~ 'load_length')|default(s.load_length, true)}mm F{v.get(k ~ 'load_speed')|default(s.load_speed, true)}, unload {v.get(k ~ 'unload_length')|default(s.unload_length, true)}mm F{v.get(k ~ 'unload_speed')|default(s.unload_speed, true)}{' (custom)' if custom_motion else ''} | {printer[name].extruder}"
  {% endfor %}


#####################################################################
#  SPOOL_SETUP [TOOL=n]
#  Click-through spool setup in a Mainsail pop-up (Klipper macro
#  prompts, shown by Mainsail and Fluidd). No typing needed:
#    1. pick the tool (skipped when TOOL= is given)
#    2. material   3. colour   4. temp profile   5. summary
#  Every button saves its one field through SET_TOOL_FILAMENT, so the
#  same checks apply, then opens the next step. Skip moves on without
#  changing that field, Back goes one step back, Cancel closes it.
#  Prompt button format is  label|gcode|style  so labels and gcode
#  here never contain a pipe. Colour buttons use the colour itself as
#  the style (newer Mainsail paints the button in it, older versions
#  show a plain button).
#####################################################################
[gcode_macro SPOOL_SETUP]
description: Click-through spool setup pop-up: tool, material, colour, temp profile. Options: TOOL=n skips the tool step. Example: SPOOL_SETUP or SPOOL_SETUP TOOL=1
gcode:
  {% set _hint = params.TOOL|default('blank = pick it in the pop-up') %}
  {% set args = params %}
  {% if 'TOOL' in args %}
    _SPOOL_SETUP_SHOW STEP=MATERIAL TOOL={args.TOOL|int}
  {% else %}
    _SPOOL_SETUP_SHOW STEP=TOOL
  {% endif %}

# Draws one step of the pop-up. Rendered only when it runs, so it
# always shows what the previous button just saved.
[gcode_macro _SPOOL_SETUP_SHOW]
variable_materials: ['PLA', 'PETG', 'ABS', 'ASA', 'TPU', 'PC', 'Nylon']
variable_hot_materials: ['ABS', 'ASA', 'PC', 'NYLON', 'PA']
variable_colors: [['Black', '000000'], ['White', 'FFFFFF'], ['Gray', '808080'], ['Red', 'FF0000'], ['Orange', 'FF8800'], ['Yellow', 'FFFF00'], ['Green', '00AA00'], ['Blue', '0000FF'], ['Purple', '8000FF'], ['Pink', 'FF66CC'], ['Brown', '8B4513'], ['Natural', 'F5F5DC']]
gcode:
  {% set args = params %}
  {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
  {% set step = args.STEP|default('TOOL')|upper %}
  {% set nums = printer.toolchanger.tool_numbers %}
  {% if step != 'TOOL' %}
    {% if args.TOOL is not defined %}
      { action_raise_error("SPOOL_SETUP: TOOL= is needed for step %s" % step) }
    {% endif %}
    {% set t = args.TOOL|int %}
    {% if t not in nums %}
      { action_raise_error("SPOOL_SETUP: there is no tool T%d. Known tools: %s" % (t, nums|join(', '))) }
    {% endif %}
    {% set v = printer.save_variables.variables %}
    {% set k = "t" ~ t ~ "_" %}
    {% set mat = v.get(k ~ 'material')|default('not set', true) %}
    {% set col = v.get(k ~ 'color')|default('not set', true) %}
    {% set prof = v.get(k ~ "temp_profile")|default(v.get(k ~ "temp_type")|default(s.default_profile, true), true)|string|upper %}
  {% endif %}
  {% if step == 'TOOL' %}
    RESPOND TYPE=command MSG="action:prompt_begin Spool setup, step 1 of 4: tool"
    RESPOND TYPE=command MSG="action:prompt_text Which tool are you setting up?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for n in nums %}
      {% set tv = printer.save_variables.variables %}
      {% set tm = tv.get('t' ~ n ~ '_material')|default('', true) %}
      {% set tc = tv.get('t' ~ n ~ '_color')|default('', true) %}
      RESPOND TYPE=command MSG="action:prompt_button {("T%d %s" % (n, tm))|trim}|_SPOOL_SETUP_SHOW STEP=MATERIAL TOOL={n}|{tc if tc else 'primary'}"
      {% if loop.index % 3 == 0 and not loop.last %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_SPOOL_SETUP_CLOSE|error"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'MATERIAL' %}
    RESPOND TYPE=command MSG="action:prompt_begin Spool setup T{t}, step 2 of 4: material"
    RESPOND TYPE=command MSG="action:prompt_text Current material: {mat}. Pick one, or Other or skip to keep it."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for m in materials %}
      RESPOND TYPE=command MSG="action:prompt_button {m}|_SPOOL_SETUP_SET TOOL={t} MATERIAL={m|upper}|primary"
      {% if loop.index % 4 == 0 %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button Other or skip|_SPOOL_SETUP_SHOW STEP=COLOR TOOL={t}|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_text For a material not listed, type it later with SET_TOOL_FILAMENT TOOL={t} MATERIAL=name"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_SPOOL_SETUP_CLOSE|error"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_SPOOL_SETUP_SHOW STEP=TOOL|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'COLOR' %}
    RESPOND TYPE=command MSG="action:prompt_begin Spool setup T{t}, step 3 of 4: colour"
    RESPOND TYPE=command MSG="action:prompt_text Current colour: {col}. Pick the closest one, or Skip to keep it."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for c in colors %}
      RESPOND TYPE=command MSG="action:prompt_button {c[0]}|_SPOOL_SETUP_SET TOOL={t} COLOR={c[1]}|{c[1]}"
      {% if loop.index % 4 == 0 and not loop.last %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button Skip|_SPOOL_SETUP_SHOW STEP=PROFILE TOOL={t}|secondary"
    RESPOND TYPE=command MSG="action:prompt_text For an exact shade, type it later with SET_TOOL_FILAMENT TOOL={t} COLOR=FF8800 (6 hex digits, no hash)"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_SPOOL_SETUP_CLOSE|error"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_SPOOL_SETUP_SHOW STEP=MATERIAL TOOL={t}|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'PROFILE' %}
    {% set hot = mat|upper in hot_materials %}
    RESPOND TYPE=command MSG="action:prompt_begin Spool setup T{t}, step 4 of 4: temp profile"
    RESPOND TYPE=command MSG="action:prompt_text Current profile: {prof}. Material: {mat}."
    RESPOND TYPE=command MSG="action:prompt_text HIGH loads at {s.high_load_temp}C and unloads at {s.high_unload_temp}C, for ABS, ASA, PC and Nylon."
    RESPOND TYPE=command MSG="action:prompt_text LOW loads at {s.low_load_temp}C and unloads at {s.low_unload_temp}C, for PLA, PETG and TPU."
    RESPOND TYPE=command MSG="action:prompt_text CUSTOM uses temps saved for this tool only. Set them in the console with SET_FILAMENT_TEMP TOOL={t} TYPE=CUSTOM TEMP=240"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button HIGH{' (suggested)' if hot and mat != 'not set' else ''}|_SPOOL_SETUP_SET TOOL={t} PROFILE=HIGH|{'primary' if hot else 'secondary'}"
    RESPOND TYPE=command MSG="action:prompt_button LOW{' (suggested)' if not hot and mat != 'not set' else ''}|_SPOOL_SETUP_SET TOOL={t} PROFILE=LOW|{'secondary' if hot else 'primary'}"
    RESPOND TYPE=command MSG="action:prompt_button CUSTOM|_SPOOL_SETUP_SET TOOL={t} PROFILE=CUSTOM|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Skip|_SPOOL_SETUP_SHOW STEP=DONE TOOL={t}|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_SPOOL_SETUP_CLOSE|error"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_SPOOL_SETUP_SHOW STEP=COLOR TOOL={t}|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'DONE' %}
    {% if prof == 'CUSTOM' %}
      {% set cl = v.get(k ~ 'custom_load_temp') %}{% set cu = v.get(k ~ 'custom_unload_temp') %}
      {% set ptxt = 'CUSTOM, load ' ~ ((cl|string ~ 'C') if cl is not none else 'not set') ~ ', unload ' ~ ((cu|string ~ 'C') if cu is not none else 'not set') %}
    {% elif prof == 'HIGH' %}
      {% set ptxt = 'HIGH, load ' ~ s.high_load_temp ~ 'C, unload ' ~ s.high_unload_temp ~ 'C' %}
    {% else %}
      {% set ptxt = 'LOW, load ' ~ s.low_load_temp ~ 'C, unload ' ~ s.low_unload_temp ~ 'C' %}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin Spool setup T{t}: done"
    RESPOND TYPE=command MSG="action:prompt_text Tool T{t} is now set to material {mat}, colour {col}, profile {ptxt}."
    {% if prof == 'CUSTOM' and (v.get(k ~ 'custom_load_temp') is none or v.get(k ~ 'custom_unload_temp') is none) %}
      RESPOND TYPE=command MSG="action:prompt_text A custom temp is missing, so that step will use HIGH. Set it with SET_FILAMENT_TEMP TOOL={t} TYPE=CUSTOM TEMP=240"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Set up another tool|_SPOOL_SETUP_SHOW STEP=TOOL|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_SPOOL_SETUP_SHOW STEP=PROFILE TOOL={t}|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Done|_SPOOL_SETUP_CLOSE|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    { action_raise_error("SPOOL_SETUP: unknown step %s" % step) }
  {% endif %}

# One button click: save that one field, then show the next step.
[gcode_macro _SPOOL_SETUP_SET]
gcode:
  {% set args = params %}
  {% set t = args.TOOL|int %}
  {% if args.MATERIAL is defined %}
    SET_TOOL_FILAMENT TOOL={t} MATERIAL={args.MATERIAL}
    _SPOOL_SETUP_SHOW STEP=COLOR TOOL={t}
  {% elif args.COLOR is defined %}
    SET_TOOL_FILAMENT TOOL={t} COLOR={args.COLOR}
    _SPOOL_SETUP_SHOW STEP=PROFILE TOOL={t}
  {% elif args.PROFILE is defined %}
    SET_TOOL_FILAMENT TOOL={t} PROFILE={args.PROFILE}
    _SPOOL_SETUP_SHOW STEP=DONE TOOL={t}
  {% else %}
    { action_raise_error("SPOOL_SETUP: nothing to save") }
  {% endif %}

[gcode_macro _SPOOL_SETUP_CLOSE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

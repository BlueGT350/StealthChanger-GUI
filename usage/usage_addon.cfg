#####################################################################
#  ktc-filament usage add-on  (rev 2, module 0.2.0)
#
#  Counts filament used per tool and, in Spoolman mode, tells
#  Moonraker's Spoolman which spool is on the active tool after
#  every tool change. Needs filament/filament_macros.cfg.
#
#  Include it AFTER filament_macros.cfg in printer.cfg:
#    [include ktc-filament/filament/filament_macros.cfg]
#    [include ktc-filament/usage/usage_addon.cfg]
#
#  Nothing here overrides KTC-Easy (no before/after_change_gcode,
#  no T# macros). A watcher looks at the active extruder once a
#  second. For exact per-tool numbers at the moment of a change you
#  can also add KTC_TOOL_SYNC before SELECT_TOOL in your T# macros
#  (see the README, optional).
#
#  Saved in variables.cfg (save_variables):
#    t#_used_mm       filament used since the last spool change
#    t#_spool_id      Spoolman spool on that tool (None = none)
#    ktc_usage_mode   'local' (default) or 'spoolman'
#
#  Commands:
#    KTC_USAGE_MODE MODE=LOCAL|SPOOLMAN
#    SET_TOOL_SPOOL TOOL=n ID=m   (ID=0 clears)
#    RESET_TOOL_USAGE TOOL=n      (new spool on a tool)
#    SHOW_TOOL_USAGE
#    KTC_TOOL_SYNC                (runs by itself)
#####################################################################

[gcode_macro _USAGE_SETTINGS]
description: ktc-filament usage add-on settings (read by the GUI)
# --- do not edit: lets the GUI detect this add-on ---
variable_module_version: '0.2.0'
variable_requires_filament_version: '0.2.0'
# how often the watcher checks the active tool, seconds (0 = off)
variable_poll_seconds: 1.0
# write the counter to variables.cfg after this many mm (also on a
# tool change and when the print ends)
variable_save_every_mm: 1000
# also count extrusion outside a print (FILAMENT_LOAD, purges by hand)
variable_count_outside_prints: False
# a tool that extrudes 5 mm or more in a print is marked loaded
variable_auto_mark_loaded: True
gcode:
  RESPOND MSG="Usage add-on v{printer['gcode_macro _USAGE_SETTINGS'].module_version}. Use SHOW_TOOL_USAGE"


[delayed_gcode _KTC_USAGE_WATCH]
initial_duration: 3
gcode:
  {% set s = printer['gcode_macro _USAGE_SETTINGS'] %}
  {% if s.poll_seconds|float > 0 %}
    UPDATE_DELAYED_GCODE ID=_KTC_USAGE_WATCH DURATION={s.poll_seconds|float}
    {% if printer.toolchanger.status != 'changing' %}
      KTC_TOOL_SYNC
    {% endif %}
  {% endif %}


#####################################################################
#  KTC_TOOL_SYNC: count new extrusion for the active tool, save it,
#  and in Spoolman mode set the active spool for the active tool.
#  Uses the highest E position seen per extruder, like Moonraker's
#  own Spoolman code, so retracts are not counted twice.
#####################################################################
[gcode_macro KTC_TOOL_SYNC]
description: Count filament used per tool and, in Spoolman mode, set the active spool. Runs by itself every second. Example: KTC_TOOL_SYNC
variable_ext: ''
variable_hi: 0.0
variable_tool: -1
variable_pend: 0.0
variable_sent: -1
gcode:
  {% set _hint = params.FLUSH|default('1 = save the counter now') %}
  {% set args = params %}
  {% set s = printer['gcode_macro _USAGE_SETTINGS'] %}
  {% set me = printer['gcode_macro KTC_TOOL_SYNC'] %}
  {% set v = printer.save_variables.variables %}
  {% set ext = printer.toolhead.extruder %}
  {% set e = printer.toolhead.position[3]|float %}
  {% set f = namespace(t=-1) %}
  {% for name in printer.toolchanger.tool_names %}
    {% if printer[name].extruder == ext %}
      {% set f.t = printer[name].tool_number %}
    {% endif %}
  {% endfor %}
  {% set st = printer.print_stats.state %}
  {% set busy = st == 'printing' or st == 'paused' %}
  {% set counting = busy or s.count_outside_prints %}
  {% set changed = ext != me.ext %}
  {% set pend = me.pend|float %}
  {% set hi = me.hi|float %}
  {% if changed %}
    {% set hi = e %}
  {% elif e > hi %}
    {% if counting and me.tool >= 0 %}
      {% set pend = pend + e - hi %}
    {% endif %}
    {% set hi = e %}
  {% endif %}
  {% if pend > 0 and me.tool >= 0 and (changed or pend >= s.save_every_mm|float or not busy or args.FLUSH|default(0)|int == 1) %}
    {% set k = 't' ~ me.tool ~ '_used_mm' %}
    SAVE_VARIABLE VARIABLE={k} VALUE={((v.get(k, 0)|float) + pend)|round(1)}
    {% if s.auto_mark_loaded and busy and pend >= 5 and 'gcode_macro _FILAMENT_SETTINGS' in printer %}
      {% if not v.get('t' ~ me.tool ~ '_loaded', False) and not v.get('t' ~ me.tool ~ '_partial', False) %}
        SAVE_VARIABLE VARIABLE=t{me.tool}_loaded VALUE=True
        RESPOND MSG="Tool T{me.tool}: printing from it, marked loaded"
      {% endif %}
    {% endif %}
    {% set pend = 0.0 %}
  {% endif %}
  {% if changed %}
    SET_GCODE_VARIABLE MACRO=KTC_TOOL_SYNC VARIABLE=ext VALUE="'{ext}'"
    SET_GCODE_VARIABLE MACRO=KTC_TOOL_SYNC VARIABLE=tool VALUE={f.t}
  {% endif %}
  {% if hi != me.hi|float %}
    SET_GCODE_VARIABLE MACRO=KTC_TOOL_SYNC VARIABLE=hi VALUE={hi}
  {% endif %}
  {% if pend != me.pend|float %}
    SET_GCODE_VARIABLE MACRO=KTC_TOOL_SYNC VARIABLE=pend VALUE={pend}
  {% endif %}
  {% if v.get('ktc_usage_mode', 'local') == 'spoolman' %}
    {% set sid = v.get('t' ~ f.t ~ '_spool_id') if f.t >= 0 else None %}
    {% if sid is not none and sid|int <= 0 %}
      {% set sid = None %}
    {% endif %}
    {% if sid is not none %}
      {% set sid = sid|int %}
    {% endif %}
    {% if sid != me.sent and (sid is not none or me.sent is not none and me.sent != -1) %}
      SET_GCODE_VARIABLE MACRO=KTC_TOOL_SYNC VARIABLE=sent VALUE={sid}
      _KTC_SPOOLMAN_SEND ID={sid if sid is not none else 0} TOOL={f.t}
    {% endif %}
  {% endif %}


[gcode_macro _KTC_SPOOLMAN_SEND]
description: Tell Moonraker's Spoolman the active spool (ID=0 = none)
gcode:
  {% set id = params.ID|default(0)|int %}
  {% if id > 0 %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
    RESPOND MSG="Spoolman: spool {id} active for tool T{params.TOOL|default('?')}"
  {% else %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
    RESPOND MSG="Spoolman: no spool assigned to tool T{params.TOOL|default('?')}, usage not tracked"
  {% endif %}


#####################################################################
#  KTC_USAGE_MODE MODE=LOCAL|SPOOLMAN
#  LOCAL counts per tool in variables.cfg only. SPOOLMAN also sets
#  Moonraker's active spool on every tool change. Pick SPOOLMAN only
#  when [spoolman] is set up in moonraker.conf (the GUI checks).
#####################################################################
[gcode_macro KTC_USAGE_MODE]
description: Choose how filament use is tracked. Options: MODE=LOCAL or SPOOLMAN (Moonraker Spoolman must be set up). Example: KTC_USAGE_MODE MODE=SPOOLMAN
gcode:
  {% set _hint = params.MODE|default('LOCAL or SPOOLMAN') %}
  {% set args = params %}
  {% set v = printer.save_variables.variables %}
  {% if args.MODE is not defined %}
    RESPOND MSG="Usage mode: {v.get('ktc_usage_mode', 'local')|upper}. Change it with KTC_USAGE_MODE MODE=LOCAL or MODE=SPOOLMAN"
  {% else %}
    {% set m = args.MODE|lower %}
    {% if m not in ['local', 'spoolman'] %}
      { action_raise_error("KTC_USAGE_MODE: MODE must be LOCAL or SPOOLMAN") }
    {% endif %}
    SAVE_VARIABLE VARIABLE=ktc_usage_mode VALUE="'{m}'"
    SET_GCODE_VARIABLE MACRO=KTC_TOOL_SYNC VARIABLE=sent VALUE=-1
    RESPOND MSG="Usage mode: {m|upper}{', the active spool follows the tool' if m == 'spoolman' else ', counted per tool in variables.cfg'}"
  {% endif %}


#####################################################################
#  SET_TOOL_SPOOL TOOL=n ID=m
#  Put Spoolman spool m on tool n (ID=0 clears it). A different spool
#  resets the tool's used counter. If the tool is active and the mode
#  is SPOOLMAN, the active spool changes right away.
#####################################################################
[gcode_macro SET_TOOL_SPOOL]
description: Assign a Spoolman spool to a tool. Options: TOOL=n, ID=spool id (0 = none). Example: SET_TOOL_SPOOL TOOL=1 ID=7
gcode:
  {% set _hint = params.TOOL|default('tool number, e.g. 0') %}
  {% set _hint = params.ID|default('Spoolman spool id, 0 = none') %}
  {% set args = params %}
  {% if args.TOOL is not defined or args.ID is not defined %}
    { action_raise_error("SET_TOOL_SPOOL: use SET_TOOL_SPOOL TOOL=n ID=m (ID=0 clears)") }
  {% endif %}
  {% set t = args.TOOL|int %}
  {% if t not in printer.toolchanger.tool_numbers %}
    { action_raise_error("SET_TOOL_SPOOL: there is no tool T%d. Known tools: %s" % (t, printer.toolchanger.tool_numbers|join(', '))) }
  {% endif %}
  {% set id = args.ID|int %}
  {% set v = printer.save_variables.variables %}
  {% set old = v.get('t' ~ t ~ '_spool_id') %}
  {% set new = id if id > 0 else None %}
  KTC_TOOL_SYNC FLUSH=1
  SAVE_VARIABLE VARIABLE=t{t}_spool_id VALUE={new}
  {% if new is not none and (old is none or old|int != new) %}
    SAVE_VARIABLE VARIABLE=t{t}_used_mm VALUE=0.0
  {% endif %}
  RESPOND MSG="Tool T{t}: {'spool ' ~ new if new is not none else 'no spool'}{' (used counter reset)' if new is not none and (old is none or old|int != new) else ''}"
  KTC_TOOL_SYNC


#####################################################################
#  RESET_TOOL_USAGE TOOL=n   (new spool on tool n)
#####################################################################
[gcode_macro RESET_TOOL_USAGE]
description: Zero a tool's used-filament counter, e.g. after a new spool. Options: TOOL=n. Example: RESET_TOOL_USAGE TOOL=2
gcode:
  {% set _hint = params.TOOL|default('tool number, e.g. 0') %}
  {% set _hint = params.QUIET|default('1 = no console message') %}
  {% set args = params %}
  {% if args.TOOL is not defined %}
    { action_raise_error("RESET_TOOL_USAGE: use RESET_TOOL_USAGE TOOL=n") }
  {% endif %}
  {% set t = args.TOOL|int %}
  {% if t not in printer.toolchanger.tool_numbers %}
    { action_raise_error("RESET_TOOL_USAGE: there is no tool T%d. Known tools: %s" % (t, printer.toolchanger.tool_numbers|join(', '))) }
  {% endif %}
  {% set me = printer['gcode_macro KTC_TOOL_SYNC'] %}
  {% if me.tool == t and me.pend|float > 0 %}
    SET_GCODE_VARIABLE MACRO=KTC_TOOL_SYNC VARIABLE=pend VALUE=0.0
  {% endif %}
  SAVE_VARIABLE VARIABLE=t{t}_used_mm VALUE=0.0
  {% if args.QUIET|default(0)|int != 1 %}
    RESPOND MSG="Tool T{t}: used counter reset to 0"
  {% endif %}


#####################################################################
#  SHOW_TOOL_USAGE
#####################################################################
[gcode_macro SHOW_TOOL_USAGE]
description: Show filament used per tool since its last spool change, and the Spoolman spool on each tool. Example: SHOW_TOOL_USAGE
gcode:
  {% set v = printer.save_variables.variables %}
  {% set me = printer['gcode_macro KTC_TOOL_SYNC'] %}
  {% set out = namespace(l=[]) %}
  {% for t in printer.toolchanger.tool_numbers %}
    {% set used = v.get('t' ~ t ~ '_used_mm', 0)|float + (me.pend|float if me.tool == t else 0) %}
    {% set sid = v.get('t' ~ t ~ '_spool_id') %}
    {% set out.l = out.l + ['Tool T%d | %.2f m used | %s' % (t, used / 1000.0, ('spool ' ~ sid) if sid is not none else 'no Spoolman spool')] %}
  {% endfor %}
  RESPOND MSG="Usage mode {v.get('ktc_usage_mode', 'local')|upper}"
  {% for l in out.l %}
    RESPOND MSG="{l}"
  {% endfor %}
